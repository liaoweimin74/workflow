spring:
  datasource:
    url: jdbc:mysql://localhost:3306/workflow?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&nullDatabaseMeansCurrent=true
    username: root
    password: 740130
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    out-of-order: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        globally_quoted_identifiers: false
    show-sql: false

flowable:
  database-schema-update: true
  async-executor-activate: false

# DevTools 热部署配置
spring.devtools.restart.enabled: true

spring.modulith:
  detection-strategy: explicitly-annotated

server:
  port: 8080

logging:
  level:
    com.workflow: DEBUG
    org.flowable: INFO
    org.springframework.modulith: DEBUG
    org.flywaydb: DEBUG

# AI 服务配置（默认关闭；配置 api-key 后置 enabled=true 启用）
workflow:
  ai:
    enabled: true
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    temperature: 0.7
    max-tokens: 4096
    connect-timeout-ms: 5000
    read-timeout-ms: 120000