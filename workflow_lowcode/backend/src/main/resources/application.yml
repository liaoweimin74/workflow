spring:
  datasource:
    url: jdbc:mysql://localhost:3306/workflow?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&nullDatabaseMeansCurrent=true
    username: root
    password: 740130
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    out-of-order: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        globally_quoted_identifiers: false
    show-sql: false

flowable:
  database-schema-update: true
  async-executor-activate: false

# DevTools 热部署配置
spring.devtools.restart.enabled: true

spring.modulith:
  detection-strategy: explicitly-annotated

server:
  port: 8080

logging:
  level:
    com.workflow: DEBUG
    org.flowable: INFO
    org.springframework.modulith: DEBUG
    org.flywaydb: DEBUG

# AI 服务配置：默认走平台内置模型（经 NestJS 内部 LLM 网关，开箱即用，无需外部 API key）。
# 外部部署时可用环境变量覆盖，接入任意 OpenAI 兼容服务（如 DeepSeek）。
workflow:
  ai:
    enabled: true
    base-url: ${AI_BASE_URL:http://127.0.0.1:8080/api/internal/llm/v1}
    api-key: ${AI_API_KEY:internal-llm}
    model: ${AI_MODEL:glm-4-plus}
    temperature: 0.7
    max-tokens: 4096
    connect-timeout-ms: 5000
    read-timeout-ms: 120000