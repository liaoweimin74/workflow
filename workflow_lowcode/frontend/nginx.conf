# 生产站点配置（frontend 镜像内替换 /etc/nginx/conf.d/default.conf）
# 与开发期 vite dev server 的口径对齐：应用挂在根路径（base=/），/api 交给 Java 后端。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 附件上传上限与后端 multipart 同口径（max-request-size: 200MB）
    client_max_body_size 200m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # proxy_pass 目标是 compose 服务名 backend，属 Docker 内置 DNS。
    # 写死的 proxy_pass 只在 nginx 启动时解析一次，后端单独重启换 IP 后此处全是 502；
    # 带变量的 proxy_pass 会按 valid= 重新解析，同时不再自动拼接 URI（故显式带 $request_uri）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 通知 SSE 长连接：必须关缓冲，否则事件被 nginx 攒住，前端收不到实时推送
    location /api/v1/notifications/sse {
        set $upstream http://backend:8080;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 业务接口。读超时 600s：AI 相关调用后端自身 read-timeout 是 120s，页面生成整轮更久
    location /api/ {
        set $upstream http://backend:8080;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Vite 产物带内容 hash，可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口与静态文档（帮助手册 public/docs/**）走再验证，避免发版后拿到旧页面
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
